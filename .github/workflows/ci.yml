name: Verify foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: API, database, and bilingual web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NEXT_TELEMETRY_DISABLED: 1
      API_BASE_URL: http://127.0.0.1:5080
      SITE_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/apps/web/package-lock.json
      - name: Verify credential policy
        run: node --test scripts/credential-policy.test.mjs && node scripts/check-credentials.mjs
      - name: Generate ephemeral test credentials
        run: node scripts/ci-secrets.mjs
      - name: Start disposable PostgreSQL
        run: docker compose up --detach --wait --wait-timeout 120 postgres
      - run: dotnet restore
      - run: dotnet format whitespace --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults
      - name: Install web dependencies
        working-directory: src/frontend/apps/web
        run: npm ci
      - name: Verify web
        working-directory: src/frontend/apps/web
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Verify repeated initialization
        run: |
          dotnet run --project src/backend/SynthesisWire.Api --configuration Release --no-build -- --migrate --seed-demo
          dotnet run --project src/backend/SynthesisWire.Api --configuration Release --no-build -- --migrate --seed-demo
      - name: Start live stack
        run: |
          dotnet run --project src/backend/SynthesisWire.Api --configuration Release --no-build -- --urls http://127.0.0.1:5080 > /tmp/api.log 2>&1 &
          (cd src/frontend/apps/web && npm start -- --hostname 127.0.0.1) > /tmp/web.log 2>&1 &
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:5080/health/ready
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/en
      - run: node scripts/smoke.mjs
      - name: Browser verification
        working-directory: src/frontend/apps/web
        run: npm run test:e2e
      - name: Isolated outage and retry verification
        working-directory: src/frontend/apps/web
        run: env -u E2E_BASE_URL npm run test:e2e
      - name: Service logs
        if: failure()
        run: cat /tmp/api.log /tmp/web.log 2>/dev/null || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: verification-results
          path: |
            TestResults
            src/frontend/apps/web/playwright-report
            src/frontend/apps/web/test-results
          if-no-files-found: ignore

      - name: Clean up disposable database
        if: always()
        run: docker compose down --volumes

  containers:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate ephemeral test credentials
        run: node scripts/ci-secrets.mjs
      - name: Build and start containers
        run: |
          docker compose config --quiet
          docker compose up --detach --build
          curl --fail --retry 60 --retry-connrefused --retry-delay 2 http://127.0.0.1:5080/health/ready
          curl --fail --retry 60 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/en
      - run: node scripts/smoke.mjs
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up disposable stack
        if: always()
        run: docker compose down --volumes
